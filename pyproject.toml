[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "alphalab"
version = "0.1.0"
description = "Research framework for symbolic alpha-factor discovery with random search, genetic programming and reinforcement learning."
readme = "README.rst"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joshua Wu", email = "joshwu10806@gmail.com" }]
keywords = ["quantitative finance", "alpha factors", "symbolic regression", "reinforcement learning", "genetic programming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
# Parquet ingestion and export. CSV and JSON work without it.
parquet = ["pyarrow>=14"]
# Neural policy and policy-gradient trainer (alphalab.rl.policy / alphalab.rl.trainer).
# The environment, action masks and every non-RL module never import torch.
rl = ["torch>=2.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.1",
    "docutils>=0.21",
]

[project.scripts]
alphalab = "alphalab.cli:main"

[project.urls]
Repository = "https://github.com/joshwu108/AlphaLab"

[tool.hatch.build.targets.wheel]
packages = ["src/alphalab"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "torch: requires the optional torch dependency (alphalab[rl])",
    "slow: longer integration test, still CPU-only and synthetic",
]
filterwarnings = ["error::RuntimeWarning:alphalab.*"]

[tool.coverage.run]
source = ["alphalab"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = ["RUF022"]

[tool.mypy]
python_version = "3.12"
packages = ["alphalab"]
mypy_path = "src"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# torch is an optional extra; the torch-free CI job type-checks without it.
module = ["torch", "torch.*"]
ignore_missing_imports = true
